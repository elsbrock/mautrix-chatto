version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/elsbrock/matrix-chatto-bridge/pkg/chattopb
plugins:
  - local: protoc-gen-go
    out: pkg/chattopb
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: pkg/chattopb
    opt: paths=source_relative
inputs:
  - directory: proto
