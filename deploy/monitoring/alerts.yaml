# Prometheus alerting rules for mautrix-chatto.
groups:
  - name: mautrix-chatto
    rules:
      - alert: MautrixChattoDown
        expr: up{job=~".*mautrix-chatto.*"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: mautrix-chatto metrics endpoint is down
          description: Prometheus could not scrape {{ $labels.instance }} for 5 minutes.

      - alert: MautrixChattoRealtimeDisconnected
        expr: sum by (instance, server) (mautrix_chatto_logins{state="CONNECTED"}) > sum by (instance, server) (mautrix_chatto_realtime_connected)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: A Chatto login has no realtime connection
          description: Some logins to Chatto server {{ $labels.server }} on {{ $labels.instance }} report connected but their realtime socket has been down for 10 minutes.

      - alert: MautrixChattoBadCredentials
        expr: sum by (instance, server) (mautrix_chatto_logins{state=~"BAD_CREDENTIALS|LOGGED_OUT"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Chatto login needs to log in again
          description: "{{ $value }} login(s) to Chatto server {{ $labels.server }} on {{ $labels.instance }} were signed out by Chatto."

      - alert: MautrixChattoReconnectStorm
        expr: sum by (instance, server) (rate(mautrix_chatto_realtime_reconnects_total[10m])) * 600 > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Realtime connection is flapping
          description: More than 10 realtime reconnects to Chatto server {{ $labels.server }} in 10 minutes on {{ $labels.instance }}.

      - alert: MautrixChattoHighEventLag
        expr: histogram_quantile(0.95, sum by (le, instance, server) (rate(mautrix_chatto_realtime_event_lag_seconds_bucket[10m]))) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Chatto events arrive late
          description: The p95 delay between event creation on Chatto server {{ $labels.server }} and receipt is above 30 seconds on {{ $labels.instance }}.

      - alert: MautrixChattoBridgeErrors
        expr: sum by (instance, server, direction) (rate(mautrix_chatto_bridge_errors_total[15m])) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Messages are failing to bridge
          description: Events in direction {{ $labels.direction }} for Chatto server {{ $labels.server }} fail at {{ $value | humanize }}/s on {{ $labels.instance }}.

      - alert: MautrixChattoRPCErrors
        expr: |
          sum by (instance, server) (rate(mautrix_chatto_rpc_errors_total{code!~"not_found|permission_denied|already_exists"}[10m]))
            / sum by (instance, server) (rate(mautrix_chatto_rpc_duration_seconds_count[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Chatto API calls are failing
          description: More than 10% of RPCs to Chatto server {{ $labels.server }} fail on {{ $labels.instance }}.

      - alert: MautrixChattoUnsupportedServer
        expr: max by (instance, server, version) (mautrix_chatto_chatto_server_info{supported="false"}) == 1
        for: 1h
        labels:
          severity: info
        annotations:
          summary: Chatto server is older than the bridge's protocol version
          description: Chatto server {{ $labels.server }} runs {{ $labels.version }}, older than the protos this bridge was built against; some features may fail.
